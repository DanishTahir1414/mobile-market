# Local development database. Bound to this machine only; never publish it to the internet.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mobilemarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or .env}
      POSTGRES_DB: mobilemarket_identity
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mobilemarket -d mobilemarket_identity']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
